<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How to play with Pug</title>
<style>
  :root {
    --ink: #3a2132;
    --paper: #fffaf6;
    --bg: #ffe3ec;
    --pink: #ff7aa2;
    --pink-soft: #ffd2df;
    --sky: #dcecfa;
    --muted: #6e4f62;
    --line: 4px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.55 "Silom", "Thonburi", system-ui, sans-serif;
    -webkit-font-smoothing: none;
    user-select: none;
    background-image:
      linear-gradient(45deg, rgba(255,255,255,.4) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.4) 75%),
      linear-gradient(45deg, rgba(255,255,255,.4) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.4) 75%);
    background-size: 16px 16px;
    background-position: 0 0, 8px 8px;
  }
  .px {
    position: relative;
    background: var(--paper);
    margin: var(--line);
    box-shadow:
      0 calc(-1 * var(--line)) 0 0 var(--ink),
      0 var(--line) 0 0 var(--ink),
      calc(-1 * var(--line)) 0 0 0 var(--ink),
      var(--line) 0 0 0 var(--ink),
      var(--line) calc(2 * var(--line)) 0 0 rgba(58, 33, 50, .2),
      calc(2 * var(--line)) var(--line) 0 0 rgba(58, 33, 50, .2);
  }
  .wrap { height: 100%; max-width: 760px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  header { padding: 12px 20px; display: flex; align-items: baseline; gap: 14px; }
  .step { background: var(--pink-soft); padding: 0 8px; font-size: 14px; white-space: nowrap; }
  h1 { margin: 0; font-size: 22px; }
  .intro { margin: 0 6px; color: var(--muted); }
  .items { flex: 1; display: grid; gap: 18px; overflow-y: auto; padding: 4px 8px 8px 4px; min-height: 0; align-content: start; }
  .items.two { grid-template-columns: 1fr 1fr; }
  .card { display: flex; flex-direction: column; gap: 10px; padding: 12px; }
  .items.one .card { display: grid; grid-template-columns: 340px 1fr; gap: 18px; align-items: center; }
  .card video { display: block; width: 100%; aspect-ratio: 26 / 25; object-fit: cover; background: var(--sky); }
  .items.one .card video { width: 340px; }
  .items.two .card video { aspect-ratio: 26 / 20; }
  .tag { display: inline-block; background: var(--pink-soft); padding: 0 8px; margin-bottom: 4px; font-size: 14px; }
  .card b { display: block; font-size: 18px; margin-bottom: 2px; }
  .card span, .card li { color: var(--muted); }
  .card ol { margin: 4px 0 0; padding-left: 20px; }
  .menu { padding: 10px 16px; }
  .menu { overflow-x: auto; }
  @media (max-width: 640px) {  /* a narrow window: one-clip lessons stack the clip over the text */
    .items.one .card { grid-template-columns: 1fr; }
    .items.one .card video { width: 100%; }
    .items.two { grid-template-columns: 1fr; }
  }
  .menu table { width: 100%; border-collapse: collapse; }
  .menu td { padding: 3px 4px; vertical-align: top; border-bottom: 2px dashed var(--pink-soft); }
  .menu tr:last-child td { border-bottom: 0; }
  .menu td:first-child { white-space: nowrap; font-weight: bold; padding-right: 16px; }
  .tips { padding: 10px 18px; }
  .tips ul { margin: 6px 0; padding-left: 20px; }
  .bar { display: flex; align-items: center; justify-content: space-between; }
  .dots { display: flex; gap: 8px; }
  .dots i { width: 10px; height: 10px; background: var(--pink-soft); box-shadow: 0 0 0 2px var(--ink); cursor: pointer; }
  .dots i.on { background: var(--pink); }
  button { font: inherit; color: var(--ink); cursor: pointer; border: 0; background: var(--pink-soft); padding: 6px 16px; }
  button.px:active { transform: translate(2px, 2px); }
  button.primary { background: #d23a6f; color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <header class="px">
    <span class="step" id="step"></span>
    <h1 id="title"></h1>
  </header>
  <p class="intro" id="intro"></p>
  <div class="items" id="items"></div>
  <div class="bar">
    <button class="px" id="back">Back</button>
    <div class="dots" id="dots"></div>
    <button class="px primary" id="next">Next</button>
  </div>
</div>

<script>

          "Thinks first, then types for a long time with code floating up",

    {

      items: [
        { clip: "12_reminder", tag: "Right-click him, then Schedule / reminders", title: "He reminds you on time", list: [

          "Fill in the time, title and details, then Add to schedule",
          "Remind me early, or repeat it every week, month or year (good for birthdays)",

        ] },
      ],
    },
    {
      title: "The menu",
      intro: "Right-click him, or click Pug's face in the menu bar at the top of the screen.",
      menu: [
        ["Hide / Show", "Hide him for a while"],
        ["Call him", "He drops in where the mouse is"],
        ["Say something", "He says one random line"],
        ["Schedule / reminders", "The calendar for your plans"],
        ["Anniversary letter", "Read the letter again"],
        ["How to play", "Opens this page"],
        ["Stash", "Pictures and files you left with him: drag them out, double-click to open"],
        ["Leave the clipboard with Pug", "Keeps a screenshot you copied"],
        ["Sleep now / Wake up", "Send him to bed, or wake him"],
        ["Work or sleep when left alone", "How soon he starts working"],
        ["Size", "Make him small, medium or large"],
        ["Walk around", "Turn his walking on or off"],
        ["Language", "English or Thai"],
        ["Edit lines", "Change the things he says"],
        ["Open at login", "He starts with your Mac"],
        ["CPU usage", "Live graphs of how hard your Mac and Pug are working"],
        ["Check for updates", "Get the newest Pug in one click"],
      ],
    },
    {
      title: "Little things",
      intro: "Things he does on his own.",
      tips: [
        "With the Dock at the bottom he stands on it; past its end he hops down to the screen edge",
        "On a day with 4 or more plans, he tells you to take a break",
        "Now and then he says something sweet by himself",
        "He starts by himself every time you turn on your Mac",
        "Drag a screenshot, a file, some text or a link onto him and he keeps it for you",
      ],
    },
  ];


  const LESSONS_TH = [
    {
      title: "จิ้มเล่น",
      intro: "Pug ยืนอยู่ขอบล่างของจอเสมอ ลองคลิกที่ตัวดูสิ",
      items: [
        { clip: "03_poke_tickle", tag: "คลิก 1 ที", title: "จั๊กจี้", text: "หัวเราะคิกคัก มีหัวใจลอยขึ้นมา" },
        { clip: "04_poke_dizzy", tag: "คลิกรัวๆ 6 ที", title: "มึนหัว", text: "ตาเป็นก้นหอย มีดาววนรอบหัว" },
      ],
    },
    {
      title: "ยกขึ้น",
      intro: "กดเมาส์ค้างไว้ที่ตัวแล้วลาก",
      items: [
        { clip: "05_hold_lift", tag: "กดค้างแล้วลาก", title: "ห้อยต่องแต่ง", text: "แกว่งไปตามเมาส์ ปล่อยแล้วตกลงพื้น ตัวยุบแล้วเด้ง" },
        { clip: "07_shake_dizzy", tag: "ยกแล้วเขย่าแรงๆ", title: "ตกใจ", text: "เหงื่อตก แล้วลงพื้นแบบมึนๆ" },
      ],
    },
    {
      title: "โยน",
      intro: "ยกขึ้น สะบัดเมาส์ไปทางไหนก็ได้ แล้วปล่อย",
      items: [
        { clip: "08_throw", tag: "ลาก สะบัด แล้วปล่อย", title: "ลอยไปชนขอบจอ", text: "ลอยข้ามจอ ชนขอบแล้วเด้งกลับมา" },
      ],
    },
    {
      title: "กลางวัน: ทำงาน",
      intro: "ปล่อยไว้ 3 นาที จะลากโต๊ะออกมานั่งเขียนโค้ด",
      items: [
        { clip: "13_work", tag: "กลางวัน", title: "นั่งเขียนโค้ด", list: [
          "คิดก่อน แล้วพิมพ์ยาวๆ มีโค้ดลอยขึ้นมา",
          "พักเล็กๆ ระหว่างทาง: คิด ยิ้ม หงุดหงิด ดื่มน้ำ บิดขี้เกียจ",
          "ทุก 5-10 นาทีจะหันมาให้กำลังใจ",
          "ทำงานครบประมาณชั่วโมง จะลุกไปเดินเล่นแล้วกลับมาทำต่อ",
          "คลิกตอนทำงานอยู่ จะหันมามอง",
        ] },
      ],
    },
    {
      title: "กลางคืน: เข้านอน",
      intro: "นอนเฉพาะหลัง 4 ทุ่ม และตื่นเองตอน 6 โมงเช้า คลิกเพื่อปลุกได้",
      items: [
        { clip: "09_goodnight", tag: "หลัง 4 ทุ่ม", title: "ฝันดี", text: "หาว บอกฝันดี แล้วนอนห่มผ้า" },
        { clip: "14_desk_sleep", tag: "ทำงานดึก", title: "หลับคาโต๊ะ", text: "คลิกแล้วตื่นมาทำงานต่อ" },
      ],
    },
    {
      title: "ตารางและการเตือน",
      intro: "ให้น้องช่วยจำแผน แล้วเตือนเมื่อถึงเวลา",
      items: [
        { clip: "12_reminder", tag: "คลิกขวาที่ตัว แล้วเลือก ตาราง / แจ้งเตือน", title: "เตือนตรงเวลา", list: [
          "คลิกวันในปฏิทิน (กดค้างแล้วลาก หรือกด Shift แล้วคลิก เพื่อเลือกหลายวัน)",
          "ใส่เวลา เรื่อง และรายละเอียด แล้วกดเพิ่มลงตาราง",
          "ให้เตือนล่วงหน้า หรือทำซ้ำทุกสัปดาห์ ทุกเดือน ทุกปี ก็ได้ (เหมาะกับวันเกิด)",
          "ติ๊กนับถอยหลัง แล้วน้องจะบอกทุกวันว่าเหลืออีกกี่วัน",
          "ถึงเวลาจะเด้งขึ้นมาบอก คลิกที่ตัวเพื่อรับทราบ",
          "เลื่อนบนปฏิทินเพื่อเปลี่ยนเดือน",
        ] },
      ],
    },
    {
      title: "เมนู",
      intro: "คลิกขวาที่ตัว หรือคลิกหน้าปั๊กที่แถบเมนูด้านบนของจอ",
      menu: [
        ["ซ่อนตัว / แสดงตัว", "ซ่อนไว้สักพัก"],
        ["เรียกมาหา", "หล่นลงมาตรงที่เมาส์อยู่"],
        ["พูดอะไรหน่อย", "พูดสุ่มมาหนึ่งประโยค"],
        ["ตาราง / แจ้งเตือน", "ปฏิทินสำหรับใส่แผน"],
        ["จดหมายวันครบรอบ", "อ่านจดหมายอีกครั้ง"],
        ["วิธีเล่น", "เปิดหน้านี้"],
        ["ของที่ฝากไว้", "รูปและไฟล์ที่ฝากไว้ ลากออกไปใช้ หรือดับเบิลคลิกเพื่อเปิด"],
        ["ฝากของในคลิปบอร์ด", "เก็บรูปที่แคปไว้ในคลิปบอร์ด"],
        ["ให้นอนเลย / ปลุก", "ส่งเข้านอน หรือปลุก"],
        ["ไปทำงานเมื่อไม่มีใครเล่นด้วย", "ปล่อยไว้นานแค่ไหนถึงเริ่มทำงาน"],
        ["ขนาด", "ตัวเล็ก กลาง หรือใหญ่"],
        ["เดินเล่นไปมา", "เปิดหรือปิดการเดิน"],
        ["ภาษา", "ภาษาอังกฤษหรือภาษาไทย"],
        ["แก้ไขข้อความ", "เปลี่ยนสิ่งที่น้องพูด"],
        ["เปิดเองตอนเปิดเครื่อง", "เปิดพร้อม Mac ทุกครั้ง"],
        ["การใช้ CPU", "กราฟดูว่า Mac กับ Pug ทำงานหนักแค่ไหน"],
        ["ตรวจหาเวอร์ชันใหม่", "อัปเดต Pug ได้ในคลิกเดียว"],
      ],
    },
    {
      title: "เรื่องเล็กๆ",
      intro: "สิ่งที่น้องทำเอง",
      tips: [
        "ถ้า Dock อยู่ด้านล่าง น้องจะยืนบน Dock พอเดินเลยปลาย Dock จะกระโดดลงขอบจอ",
        "วันไหนมีแผนตั้งแต่ 4 อัน น้องจะบอกให้พักบ้าง",
        "บางทีก็พูดอะไรหวานๆ ขึ้นมาเอง",
        "เปิดเองทุกครั้งที่เปิดเครื่อง",
        "ลากรูปที่แคป ไฟล์ ข้อความ หรือลิงก์ มาวางบนตัวน้อง น้องจะเก็บไว้ให้",
      ],
    },
  ];
  if (window.LANG === "th") {
    LESSONS.splice(0, LESSONS.length, ...LESSONS_TH);
    document.documentElement.lang = "th";
    document.getElementById("back").textContent = "ก่อนหน้า";
    document.getElementById("next").textContent = "ถัดไป";
  }

  const $ = (id) => document.getElementById(id);
  let at = 0;
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function render() {
    const l = LESSONS[at];
    $("step").textContent = `${at + 1} / ${LESSONS.length}`;
    $("title").textContent = l.title;
    $("intro").textContent = l.intro;
    const items = $("items");
    items.textContent = "";
    items.scrollTop = 0;
    items.className = "items " + ((l.items || []).length === 2 ? "two" : "one");
    (l.items || []).forEach((it) => {
      const card = el("div", "card px");
      const v = el("video");
      v.src = `guide/${window.LANG === "th" ? "th/" : ""}${it.clip}.mp4`;  // the Thai set has Thai speech bubbles
      v.autoplay = v.loop = v.muted = v.playsInline = true;
      card.appendChild(v);
      const text = el("div");
      text.appendChild(el("span", "tag", it.tag));
      text.appendChild(el("b", "", it.title));
      if (it.text) text.appendChild(el("span", "", it.text));
      if (it.list) {
        const ol = el("ol");
        it.list.forEach((li) => ol.appendChild(el("li", "", li)));
        text.appendChild(ol);
      }
      card.appendChild(text);
      items.appendChild(card);
    });
    if (l.menu) {
      const box = el("div", "menu px");
      const t = el("table");
      l.menu.forEach(([a, b]) => {
        const tr = el("tr");
        tr.appendChild(el("td", "", a));
        tr.appendChild(el("td", "", b));
        t.appendChild(tr);
      });
      box.appendChild(t);
      items.appendChild(box);
    }
    if (l.tips) {
      const box = el("div", "tips px");
      const ul = el("ul");
      l.tips.forEach((x) => ul.appendChild(el("li", "", x)));
      box.appendChild(ul);
      items.appendChild(box);
    }
    $("back").style.visibility = at === 0 ? "hidden" : "visible";
    $("next").style.visibility = at === LESSONS.length - 1 ? "hidden" : "visible";
    $("dots").textContent = "";
    LESSONS.forEach((_, i) => {
      const d = el("i", i === at ? "on" : "");
      d.title = LESSONS[i].title;
      d.onclick = () => { at = i; render(); };
      $("dots").appendChild(d);
    });
  }

  $("back").onclick = () => { if (at > 0) { at--; render(); } };
  $("next").onclick = () => { if (at < LESSONS.length - 1) { at++; render(); } };
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") $("next").click();
    if (e.key === "ArrowLeft") $("back").click();
  });
  window.GUIDE = { go(i) { at = Math.max(0, Math.min(LESSONS.length - 1, i)); render(); } };
  render();
})();
</script>
</body>
</html>
