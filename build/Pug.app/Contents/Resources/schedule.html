<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pug's Schedule</title>
<style>
  :root {
    --ink: #1f2d40;
    --paper: #f8fcff;
    --bg: #dcecfa;
    --accent: #4fa3e3;
    --accent-soft: #d3e9fb;
    --sel: #b9dcfb;
    --pink: #ff7aa2;
    --mint: #d4f3e1;
    --muted: #5c6f84;
    --line: 4px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.35 "Silom", "Thonburi", system-ui, sans-serif;
    -webkit-font-smoothing: none;
    image-rendering: pixelated;
    user-select: none;
    background-image:
      linear-gradient(45deg, rgba(255,255,255,.35) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.35) 75%),
      linear-gradient(45deg, rgba(255,255,255,.35) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.35) 75%);
    background-size: 16px 16px;
    background-position: 0 0, 8px 8px;
  }

  /* pixel box: a 4px ink frame with notched corners, plus a hard drop shadow */
  .px {
    position: relative;
    background: var(--paper);
    margin: var(--line);
    box-shadow:
      0 calc(-1 * var(--line)) 0 0 var(--ink),
      0 var(--line) 0 0 var(--ink),
      calc(-1 * var(--line)) 0 0 0 var(--ink),
      var(--line) 0 0 0 var(--ink),
      var(--line) calc(2 * var(--line)) 0 0 rgba(31, 45, 64, .2),
      calc(2 * var(--line)) var(--line) 0 0 rgba(31, 45, 64, .2);
  }
  .px.flat { box-shadow:
      0 calc(-1 * var(--line)) 0 0 var(--ink), 0 var(--line) 0 0 var(--ink),
      calc(-1 * var(--line)) 0 0 0 var(--ink), var(--line) 0 0 0 var(--ink); }

  .app { display: grid; grid-template-rows: auto 1fr; gap: 14px; height: 100%; padding: 16px 18px 18px; }

  header { display: flex; align-items: center; gap: 14px; padding: 10px 14px; }
  .avatar { width: 72px; height: 72px; object-fit: cover; image-rendering: auto; background: var(--accent-soft); }
  .title h1 { margin: 0; font-size: 22px; letter-spacing: .5px; }
  .title p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .nav { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .month { min-width: 170px; text-align: center; font-size: 20px; }

  button {
    font: inherit; color: var(--ink); cursor: pointer; border: 0;
    background: var(--accent-soft); padding: 6px 12px;
  }
  button.px:active { transform: translate(2px, 2px); }
  button.primary { background: var(--accent); color: #fff; }
  button.icon { padding: 4px 10px; font-size: 16px; }

  main { display: grid; grid-template-columns: 1fr 300px; gap: 18px; min-height: 0; }

  .cal { display: grid; grid-template-rows: auto 1fr; padding: 10px; min-height: 0; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; padding: 0 4px 8px; color: var(--muted); text-align: center; }
  .week span:first-child { color: var(--accent); }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; gap: 8px; padding: 4px; min-height: 0; }
  .day { margin: 2px; padding: 4px 5px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-height: 0; }
  .day.other { opacity: .38; }
  .day.today .num { background: var(--accent); color: #fff; }
  .day.sel { background: var(--sel); }
  body.dragging, body.dragging * { cursor: col-resize !important; }
  .days { user-select: none; -webkit-user-select: none; -webkit-user-drag: none; }
  .day:hover { background: #fff; }
  .day.sel:hover { background: var(--sel); }
  .num { flex: none; align-self: flex-start; padding: 0 5px; font-size: 14px; }
  .chip { flex: none; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
          background: var(--accent-soft); padding: 0 4px; border-left: 4px solid var(--accent); }
  .chip.span { border-left-color: #8fc6f0; }
  .chip.again { border-left-color: var(--pink); }
  .chip.done { background: #e7edf3; border-left-color: var(--muted); color: var(--muted); }
  .more { flex: none; font-size: 12px; color: var(--muted); }
  .busy { position: absolute; right: 4px; top: 4px; }

  aside { display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow-y: auto; padding: 4px 8px 8px 4px; }
  .panel { padding: 12px; }
  .panel h2 { margin: 0 0 8px; font-size: 17px; }
  .list { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; max-height: 170px; padding: 4px; }
  .item { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: start; padding: 6px 8px; }
  .time { background: var(--ink); color: #fff; padding: 0 5px; font-size: 13px; }
  .item b { display: block; font-size: 15px; }
  .item small { color: var(--muted); font-size: 13px; }
  .item.done { opacity: .55; }
  .del { background: transparent; padding: 0 4px; color: var(--muted); }
  .del:hover { color: var(--accent); }
  .empty { color: var(--muted); font-size: 14px; padding: 6px 2px; }

  form { display: flex; flex-direction: column; gap: 5px; }
  label { font-size: 13px; color: var(--muted); }
  .dates { display: grid; grid-template-columns: 1fr 1fr; }
  .dates div { display: flex; flex-direction: column; min-width: 0; }
  .dates input { min-width: 0; font-size: 13px; }
  .hint { font-size: 12px; color: var(--muted); margin: 2px 2px 0; }
  input {
    font: inherit; color: var(--ink); border: 0; outline: none; background: #fff;
    padding: 4px 8px; margin: 3px 4px; user-select: text;
    box-shadow: 0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink), -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink);
  }
  input:focus, select:focus { background: #f0f8ff; }
  select {
    font: inherit; font-size: 13px; color: var(--ink); border: 0; outline: none; background: #fff;
    padding: 4px 6px; margin: 3px 4px; min-width: 0; -webkit-appearance: none; appearance: none;
    box-shadow: 0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink), -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink);
  }
  input:disabled { color: var(--muted); background: #eef3f8; }
  .rest { background: var(--mint); padding: 10px 12px; display: flex; gap: 10px; align-items: center; }
  .rest[hidden] { display: none; }
  .heart { width: 22px; height: 20px; flex: none; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); padding: 8px 14px; background: var(--paper); }
  .toast[hidden] { display: none; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="heart" viewBox="0 0 11 10" shape-rendering="crispEdges">
      <path fill="#1f2d40" d="M1 0h3v1h1v1h1V1h1V0h3v1h1v4h-1v1h-1v1h-1v1h-1v1h-1v1H5V9H4V8H3V7H2V6H1V5H0V1h1z"/>
      <path fill="#ff7aa2" d="M1 1h3v1h1v1h1V2h1V1h3v4H9v1H8v1H7v1H6v1H5V8H4V7H3V6H2V5H1z"/>
      <path fill="#fff" d="M2 2h1v1H2z"/>
    </symbol>
  </defs>
</svg>

<div class="app">
  <header class="px">
    <img class="avatar px flat" id="avatar" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
    <div class="title">
      <h1>Pug's Schedule</h1>
      <p id="subtitle">Add your plans and Pug will remind you.</p>
    </div>
    <div class="nav">
      <button class="px icon" id="prev" title="Previous month">◀</button>
      <div class="month" id="month"></div>
      <button class="px icon" id="next" title="Next month">▶</button>
      <button class="px" id="today">Today</button>
    </div>
  </header>

  <main>
    <section class="cal px">
      <div class="week"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
      <div class="days" id="days"></div>
    </section>

    <aside>
      <div class="panel px">
        <h2 id="dayTitle"></h2>
        <div class="list" id="list"></div>
      </div>

      <div class="rest px" id="rest" hidden>
        <svg class="heart"><use href="#heart"/></svg>
        <div>That's a lot for one day.<br><b>Take a break too!</b></div>
      </div>

      <div class="panel px">
        <h2>New plan</h2>
        <form id="form" autocomplete="off">
          <div class="dates">
            <div><label for="from">From</label><input id="from" type="date" required></div>
            <div><label for="to">To</label><input id="to" type="date" required></div>
          </div>
          <p class="hint">Hold on a day, then drag, or Shift-click, to pick several days. Scroll the calendar to change month.</p>
          <label for="time">Time</label>
          <input id="time" type="time" value="09:00" required>
          <div class="dates">
            <div><label for="ahead">Remind me</label>
              <select id="ahead"><option value="0">On time</option><option value="15">15 min before</option>
                <option value="60">1 hour before</option><option value="1440">1 day before</option></select></div>
            <div><label for="rep">Repeat</label>
              <select id="rep"><option value="">Never</option><option value="week">Every week</option>
                <option value="month">Every month</option><option value="year">Every year</option></select></div>
          </div>
          <label for="t">Title</label>
          <input id="t" placeholder="e.g. Meeting, exam, dinner" required maxlength="60">
          <label for="d">Details</label>
          <input id="d" placeholder="Optional" maxlength="80">
          <button class="px primary" type="submit">+ Add to schedule</button>
        </form>
      </div>
    </aside>
  </main>
</div>
<div class="toast px" id="toast" hidden></div>

<script>
(() => {
  // Thai when Pug's menu says so (Swift sets window.LANG before this runs); years then use the Buddhist era
  const TH = window.LANG === "th";
  const tr = (en, th) => (TH ? th : en);
  const STATIC_TH = {
    "Pug's Schedule": "ตารางของ Pug", "Previous month": "เดือนก่อน", "Next month": "เดือนถัดไป", "Today": "วันนี้",
    "Sun": "อา", "Mon": "จ", "Tue": "อ", "Wed": "พ", "Thu": "พฤ", "Fri": "ศ", "Sat": "ส",
    "That's a lot for one day.": "วันนี้งานเยอะจัง", "Take a break too!": "อย่าลืมพักด้วยน้า",
    "New plan": "เพิ่มแผน", "From": "ตั้งแต่", "To": "ถึง",
    "Hold on a day, then drag, or Shift-click, to pick several days. Scroll the calendar to change month.":
      "กดค้างที่วันแล้วลาก หรือกด Shift แล้วคลิก เพื่อเลือกหลายวัน เลื่อนบนปฏิทินเพื่อเปลี่ยนเดือน",
    "Time": "เวลา", "Title": "เรื่อง", "Details": "รายละเอียด", "e.g. Meeting, exam, dinner": "เช่น ประชุม สอบ กินข้าว",
    "Optional": "ไม่ใส่ก็ได้", "+ Add to schedule": "+ เพิ่มลงตาราง",
    "Remind me": "เตือน", "On time": "ตรงเวลา", "15 min before": "ก่อน 15 นาที", "1 hour before": "ก่อน 1 ชั่วโมง",
    "1 day before": "ก่อน 1 วัน", "Repeat": "ทำซ้ำ", "Never": "ไม่ซ้ำ", "Every week": "ทุกสัปดาห์",
    "Every month": "ทุกเดือน", "Every year": "ทุกปี",
  };
  if (TH) {
    document.documentElement.lang = "th";
    document.title = STATIC_TH[document.title] || document.title;
    const walk = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    for (let n; (n = walk.nextNode());) {
      const k = n.nodeValue.trim();
      if (STATIC_TH[k]) n.nodeValue = n.nodeValue.replace(k, STATIC_TH[k]);
    }
    for (const e of document.querySelectorAll("[placeholder], [title]")) {
      for (const a of ["placeholder", "title"]) if (STATIC_TH[e.getAttribute(a)]) e.setAttribute(a, STATIC_TH[e.getAttribute(a)]);
    }
  }
  const MONTHS = TH ? ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
                       "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"]
                    : ["January", "February", "March", "April", "May", "June",
                       "July", "August", "September", "October", "November", "December"];
  const SHORT = TH ? ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."]
                   : MONTHS.map((m) => m.slice(0, 3));
  const WEEKDAYS = TH ? ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์"]
                      : ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const BUSY = 4;

  let events = [];
  let today = iso(new Date());
  let selected = { from: today, to: today };  // the picked days, from <= to
  let anchor = today;                          // where a drag or Shift-click starts
  let dragging = false;                        // only after holding the mouse on a day for HOLD ms
  let holdTimer = 0;
  let downAt = null;                           // where the button went down, while it is held
  let pendingLoad = false;                     // plans that came in from Pug during a drag
  const HOLD = 350;
  let view = { y: +today.slice(0, 4), m: +today.slice(5, 7) - 1 };

  const $ = (id) => document.getElementById(id);
  function iso(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }
  function parse(key) {
    const [y, m, d] = key.split("-").map(Number);
    return new Date(y, m - 1, d);
  }
  function short(key) { const d = parse(key); return TH ? `${d.getDate()} ${SHORT[d.getMonth()]}` : `${SHORT[d.getMonth()]} ${d.getDate()}`; }
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  const endOf = (e) => e.end || e.date;
  const dayMs = 86400000;
  // does a repeating plan come round on this day? (the 31st falls on a short month's last day, Feb 29 on Feb 28)
  function repeatsOn(e, key) {
    if (key < e.date) return false;
    const s = parse(e.date), k = parse(key);
    const last = new Date(k.getFullYear(), k.getMonth() + 1, 0).getDate();
    if (e.repeats === "week") return Math.round((k - s) / dayMs) % 7 === 0;
    if (e.repeats === "month") return k.getDate() === Math.min(s.getDate(), last);
    if (e.repeats === "year") return k.getMonth() === s.getMonth() && k.getDate() === Math.min(s.getDate(), last);
    return false;
  }
  function occursOn(e, key) { return e.repeats ? repeatsOn(e, key) : e.date <= key && endOf(e) >= key; }
  // events that touch any day from a to b
  function between(a, b) {
    return events.filter((e) => {
      if (!e.repeats) return e.date <= b && endOf(e) >= a;
      for (let d = parse(a < e.date ? e.date : a); iso(d) <= b; d.setDate(d.getDate() + 1)) if (repeatsOn(e, iso(d))) return true;
      return false;
    }).sort((x, y) => (x.time + x.date).localeCompare(y.time + y.date));
  }
  const doneOn = (e, key) => (e.repeats ? e.lastNotified === key : e.notified);
  const REPEAT = TH ? { week: "ทุกสัปดาห์", month: "ทุกเดือน", year: "ทุกปี" }
                   : { week: "Every week", month: "Every month", year: "Every year" };
  const AHEAD = TH ? { 15: "เตือนก่อน 15 นาที", 60: "เตือนก่อน 1 ชั่วโมง", 1440: "เตือนก่อน 1 วัน" }
                  : { 15: "15 min early", 60: "1 hour early", 1440: "1 day early" };
  function onDay(key) { return between(key, key); }
  function span(e) { return e.end && e.end !== e.date ? `${short(e.date)} – ${short(e.end)}` : ""; }
  function save() {
    try { window.webkit.messageHandlers.pug.postMessage({ op: "save", events }); } catch (_) {}
  }
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => (t.hidden = true), 2200);
  }
  function pick(a, b) {
    selected = a <= b ? { from: a, to: b } : { from: b, to: a };
    $("from").value = selected.from;
    $("to").value = selected.to;
  }

  function renderMonth() {
    $("month").textContent = `${MONTHS[view.m]} ${TH ? view.y + 543 : view.y}`;
    const days = $("days");
    days.textContent = "";
    const first = new Date(view.y, view.m, 1);
    const start = new Date(view.y, view.m, 1 - first.getDay());
    for (let i = 0; i < 42; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      const key = iso(d);
      const cell = el("div", "day px flat");
      cell.dataset.key = key;
      if (d.getMonth() !== view.m) cell.classList.add("other");
      if (key === today) cell.classList.add("today");
      if (key >= selected.from && key <= selected.to) cell.classList.add("sel");
      // the 1st shows its month, like "Nov 1", so the turn of the month is easy to see
      cell.appendChild(el("span", "num", d.getDate() === 1 ? (TH ? `1 ${SHORT[d.getMonth()]}` : `${SHORT[d.getMonth()]} 1`) : d.getDate()));
      const list = events.filter((e) => occursOn(e, key)).sort((x, y) => x.time.localeCompare(y.time));
      list.slice(0, 2).forEach((e) => {
        const c = el("div", "chip" + (e.end && e.end !== e.date ? " span" : "") + (e.repeats ? " again" : "") + (doneOn(e, key) ? " done" : ""), e.title);
        c.title = `${e.time} ${e.title}${span(e) ? " (" + span(e) + ")" : ""}`;
        cell.appendChild(c);
      });
      if (list.length > 2) cell.appendChild(el("div", "more", tr(`+${list.length - 2} more`, `+อีก ${list.length - 2}`)));
      if (list.length >= BUSY) {
        const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        s.setAttribute("class", "heart busy");
        s.setAttribute("width", "16"); s.setAttribute("height", "15");
        const u = document.createElementNS("http://www.w3.org/2000/svg", "use");
        u.setAttribute("href", "#heart");
        s.appendChild(u);
        cell.appendChild(s);
      }
      days.appendChild(cell);
    }
  }

  function renderDay() {
    const one = selected.from === selected.to;
    const d = parse(selected.from);
    $("dayTitle").textContent = one
      ? tr(`${WEEKDAYS[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}`, `วัน${WEEKDAYS[d.getDay()]}ที่ ${d.getDate()} ${MONTHS[d.getMonth()]}`)
      : `${short(selected.from)} – ${short(selected.to)}`;
    const list = $("list");
    list.textContent = "";
    const items = between(selected.from, selected.to);
    if (!items.length) list.appendChild(el("div", "empty", one ? tr("Nothing planned. A free day!", "ยังไม่มีแผน ว่างทั้งวันเลย") : tr("Nothing planned on these days.", "ช่วงนี้ยังไม่มีแผน")));
    items.forEach((e) => {
      const done = one ? doneOn(e, selected.from) : !e.repeats && e.notified;
      const row = el("div", "item px flat" + (done ? " done" : ""));
      row.appendChild(el("span", "time", e.time));
      const text = el("div");
      text.appendChild(el("b", "", e.title));
      const notes = [span(e) || (one || e.repeats ? "" : short(e.date)), REPEAT[e.repeats], AHEAD[e.ahead], e.detail,
                     done ? tr("Reminded ✓", "เตือนแล้ว ✓") : ""].filter(Boolean);
      if (notes.length) text.appendChild(el("small", "", notes.join(" · ")));
      row.appendChild(text);
      const del = el("button", "del", "✕");
      del.title = tr("Delete", "ลบ");
      del.addEventListener("click", () => {
        events = events.filter((x) => x.id !== e.id);
        save();
        render();
      });
      row.appendChild(del);
      list.appendChild(row);
    });
    $("rest").hidden = !one || items.length < BUSY;
    const n = events.filter((e) => (e.repeats ? repeatsOn(e, today) : e.date === today) && !doneOn(e, today)).length;
    $("subtitle").textContent = n ? tr(`${n} more ${n === 1 ? "plan" : "plans"} today. Pug will remind you.`, `วันนี้เหลืออีก ${n} แผน เดี๋ยว Pug เตือนให้`)
                                  : tr("Add your plans and Pug will remind you.", "ใส่แผนไว้ได้เลย เดี๋ยว Pug เตือนให้");
  }

  function render() { renderMonth(); renderDay(); }

  // Picking days. A click picks one day. Holding the button on a day for HOLD ms starts a drag,
  // and moving over other days stretches the pick. During a drag the cells are only re-coloured,
  // never rebuilt: rebuilding them makes WebKit send fake mouse moves that read as "button up".
  const cellAt = (x, y) => document.elementFromPoint(x, y)?.closest(".day");
  function paintSel() {
    for (const c of $("days").children) c.classList.toggle("sel", c.dataset.key >= selected.from && c.dataset.key <= selected.to);
    renderDay();
  }
  function stopDrag() {
    clearTimeout(holdTimer);
    if (!dragging) return false;
    dragging = false;
    document.body.classList.remove("dragging");
    return true;
  }
  $("days").addEventListener("pointerdown", (ev) => {
    const cell = ev.target.closest(".day");
    if (ev.button !== 0 || ev.ctrlKey || !cell) return;  // Ctrl-click is a right-click on a Mac
    ev.preventDefault();  // no text selection, so the browser never starts dragging the day's number
    $("days").setPointerCapture(ev.pointerId);  // keep getting moves and the release, even outside the window
    if (!ev.shiftKey) anchor = cell.dataset.key;
    pick(anchor, cell.dataset.key);
    paintSel();
    clearTimeout(holdTimer);
    downAt = { x: ev.clientX, y: ev.clientY };
    holdTimer = setTimeout(() => {
      dragging = true;
      document.body.classList.add("dragging");
    }, HOLD);
  });
  $("days").addEventListener("pointermove", (ev) => {
    if (!dragging) {
      // moved more than a jitter before the hold: it stays a click
      if (downAt && Math.hypot(ev.clientX - downAt.x, ev.clientY - downAt.y) > 4) clearTimeout(holdTimer);
      return;
    }
    const key = cellAt(ev.clientX, ev.clientY)?.dataset.key;
    if (!key) return;
    if (selected.from === (anchor <= key ? anchor : key) && selected.to === (anchor <= key ? key : anchor)) return;
    pick(anchor, key);
    paintSel();
  });
  const release = () => {
    downAt = null;
    if (stopDrag()) $("t").focus();
    if (pendingLoad) { pendingLoad = false; render(); }
  };
  $("days").addEventListener("pointerup", release);
  $("days").addEventListener("pointercancel", release);
  window.addEventListener("blur", release);
  $("days").addEventListener("dragstart", (ev) => ev.preventDefault());
  $("days").addEventListener("webkitmouseforcewillbegin", (ev) => ev.preventDefault());  // a firm trackpad press would start Look Up
  function shiftMonth(n) {
    view.m += n;
    if (view.m < 0) { view.m = 11; view.y--; }
    if (view.m > 11) { view.m = 0; view.y++; }
    renderMonth();
  }
  $("prev").onclick = () => shiftMonth(-1);
  $("next").onclick = () => shiftMonth(1);
  // scroll (mouse wheel or two-finger swipe, up/down or sideways) over the calendar to change month
  let wheel = 0, wheelLock = 0;
  document.querySelector(".cal").addEventListener("wheel", (ev) => {
    ev.preventDefault();
    const now = Date.now();
    if (now < wheelLock) return;
    wheel += Math.abs(ev.deltaX) > Math.abs(ev.deltaY) ? ev.deltaX : ev.deltaY;
    if (Math.abs(wheel) < 60) return;
    shiftMonth(wheel > 0 ? 1 : -1);
    wheel = 0;
    wheelLock = now + 450;
  }, { passive: false });
  $("today").onclick = () => { anchor = today; pick(today, today); view = { y: +today.slice(0, 4), m: +today.slice(5, 7) - 1 }; render(); };
  for (const id of ["from", "to"]) {
    $(id).addEventListener("change", () => {
      const a = $("from").value || selected.from, b = $("to").value || a;
      anchor = a <= b ? a : b;
      pick(a, b);
      const v = parse(selected.from);
      view = { y: v.getFullYear(), m: v.getMonth() };
      render();
    });
  }

  // a repeating plan is one day: the first day it happens
  $("rep").addEventListener("change", () => {
    $("to").disabled = !!$("rep").value;
    if ($("rep").value) { pick(selected.from, selected.from); render(); }
  });

  $("form").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const title = $("t").value.trim();
    if (!title) return;
    const time = $("time").value || "09:00";
    const e = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
                date: selected.from, time, title, detail: $("d").value.trim(), notified: false };
    if ($("rep").value) e.repeats = $("rep").value;            // repeating plans are one day long
    else if (selected.to !== selected.from) e.end = selected.to;
    if (+$("ahead").value) e.ahead = +$("ahead").value;
    events.push(e);
    save();
    try { window.webkit.messageHandlers.pug.postMessage({ op: "added", date: selected.from }); } catch (_) {}
    $("t").value = "";
    $("d").value = "";
    render();
    const extra = `${span(e) ? ", " + span(e) : ""}${e.repeats ? ", " + REPEAT[e.repeats].toLowerCase() : ""}`;
    toast(tr(`Added "${title}" at ${time}${extra}`, `เพิ่ม "${title}" ตอน ${time} แล้ว${extra}`));
  });

  window.PUG = {
    load(list, avatar, todayISO) {
      events = Array.isArray(list) ? list : [];
      if (avatar) $("avatar").src = avatar;
      if (todayISO && todayISO !== today) {
        today = todayISO;
        if (!downAt) {
          anchor = today;
          view = { y: +today.slice(0, 4), m: +today.slice(5, 7) - 1 };
          pick(today, today);
        }
      }
      // rebuilding the cells mid-press would cut a drag short; draw once the button is up
      if (downAt) pendingLoad = true; else render();
    },
  };
  pick(today, today);
  render();
})();
</script>
</body>
</html>
